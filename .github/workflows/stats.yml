name: Generate stats card

on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate stats.svg
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&locale=en&hide_border=false&border_color=7FFFD4&border_radius=12&bg_color=050708&title_color=7FFFD4&text_color=FFFFFF&icon_color=7FFFD4&ring_color=7FFFD4
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: set Courier font
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('dist/stats.svg')
          text = path.read_text()
          replacements = {
              "'Segoe UI', Ubuntu, Sans-Serif": "'Courier New', Courier, monospace",
              "'Segoe UI', Ubuntu, \"Helvetica Neue\", Sans-Serif": "'Courier New', Courier, monospace",
              "'Segoe UI', Ubuntu, Sans-serif": "'Courier New', Courier, monospace",
              "Segoe UI, Ubuntu, Sans-Serif": "Courier New, Courier, monospace",
              "Segoe UI, Ubuntu, \"Helvetica Neue\", Sans-Serif": "Courier New, Courier, monospace",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: push stats.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
